# ══════════════════════════════════════════════════════════════════
#  nginx/nginx.conf — Main reverse proxy
#  Runs as non-root (nginx image already handles this)
#  Routes:  /api/* → backend:5000   |   /* → frontend:80
# ══════════════════════════════════════════════════════════════════

worker_processes auto;
pid /tmp/nginx.pid;   # writable by non-root

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 10M;

    # Temp paths writable by non-root
    client_body_temp_path  /tmp/client_temp;
    proxy_temp_path        /tmp/proxy_temp;
    fastcgi_temp_path      /tmp/fastcgi_temp;
    uwsgi_temp_path        /tmp/uwsgi_temp;
    scgi_temp_path         /tmp/scgi_temp;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # Access log format with response time
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    server {
        listen 80;
        server_name localhost;

        # API → backend
        location /api/ {
            proxy_pass         http://backend:5000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        '';
            proxy_read_timeout 60s;
        }

        # Health check passthrough
        location /health {
            proxy_pass http://backend:5000;
        }

        # Live log viewer (browser tab)
        location /api/logs {
            proxy_pass         http://backend:5000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Frontend static files
        location / {
            proxy_pass         http://frontend:80;
            proxy_set_header   Host $host;
        }
    }
}
