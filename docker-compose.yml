# ══════════════════════════════════════════════════════════════════
#  docker-compose.yml — Hyderabad Education Tech
#
#  ALL CONTAINERS RUN AS NON-ROOT for security.
#  Logs viewable via:  docker compose logs -f [service]
#
#  START (first time):   docker compose down -v && docker compose up --build -d
#  START (normal):       docker compose up --build -d
#  LOGS:                 docker compose logs -f backend
#  STOP:                 docker compose down
# ══════════════════════════════════════════════════════════════════

services:

  # ── DATABASE ─────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: hyd_edutech_db
    restart: unless-stopped
    user: "70:70"          # postgres uid in alpine image (non-root)
    environment:
      POSTGRES_DB:       ${DB_NAME:-hyd_edutech}
      POSTGRES_USER:     ${DB_USER:-hyd_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-HydEduTech@2024!Secure}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - app_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-hyd_admin} -d ${DB_NAME:-hyd_edutech}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── BACKEND API ──────────────────────────────────────────────────
  # Runs as non-root user "nodeuser" (uid 1001) defined in Dockerfile
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hyd_edutech_backend
    restart: unless-stopped
    environment:
      NODE_ENV:       production
      PORT:           5000
      DB_HOST:        db
      DB_PORT:        5432
      DB_NAME:        ${DB_NAME:-hyd_edutech}
      DB_USER:        ${DB_USER:-hyd_admin}
      DB_PASSWORD:    ${DB_PASSWORD:-HydEduTech@2024!Secure}
      JWT_SECRET:     ${JWT_SECRET:-HydEduTech_JWT_2024_SuperSecret_Key_xyz789!@#}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      FRONTEND_URL:   ${FRONTEND_URL:-http://localhost}
      # Payment: "dummy" works now (no Stripe account needed)
      # To enable Stripe: set PAYMENT_GATEWAY=stripe + STRIPE_SECRET_KEY=sk_live_...
      PAYMENT_GATEWAY:   ${PAYMENT_GATEWAY:-dummy}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      PAYMENT_CURRENCY:  ${PAYMENT_CURRENCY:-USD}
      LOG_TOKEN:         ${LOG_TOKEN:-HydLogs@2024}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ── FRONTEND ─────────────────────────────────────────────────────
  # Runs as non-root user "webuser" (uid 1001) defined in Dockerfile
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hyd_edutech_frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - app_net
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ── NGINX ────────────────────────────────────────────────────────
  # Only container exposed to internet (port 80)
  # Runs nginx worker as non-root via /tmp paths
  nginx:
    image: nginx:1.25-alpine
    container_name: hyd_edutech_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_tmp:/tmp
    depends_on:
      - frontend
      - backend
    networks:
      - app_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    driver: local
  nginx_tmp:
    driver: local

networks:
  app_net:
    driver: bridge
